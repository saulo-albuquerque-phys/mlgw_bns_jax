# Conda environment for mlgw_bns_jax ROQ PE on IGWN/LIGO Jupyter
#
# Usage:
#   conda env create -f environment.yml
#   conda activate mlgw-bns-jax
#   pip install -e ./_sharpy_repo && pip install -e .
#   python -m ipykernel install --user --name mlgw-bns-jax --display-name "mlgw-bns-jax"
#
# Then select the "mlgw-bns-jax" kernel in Jupyter.
#
# If `conda env create` fails due to IGWN base conflicts, use instead:
#   conda create -n mlgw-bns-jax -c conda-forge --override-channels \
#     python=3.11 pip framel lalsuite gwpy ipykernel numpy scipy \
#     matplotlib h5py astropy numba pandas scikit-learn tqdm
#   conda activate mlgw-bns-jax
#   pip install jax jaxlib jaxopt optax equinox flax ripplegw corner \
#     anesthetic seaborn "NetKet==3.20.5" PyYAML toml dacite joblib \
#     sortedcontainers requests \
#     "blackjax @ git+https://github.com/gabrieledemasi/blackjax@main" \
#     "JenpyROQ @ git+https://github.com/GCArullo/JenpyROQ.git"
#   pip install -e ./_sharpy_repo && pip install -e .

name: mlgw-bns-jax

channels:
  - conda-forge

dependencies:
  - python>=3.11,<3.13
  - pip

  # ── C libraries only available via conda-forge ────────────────────
  - framel                   # required for reading GW frame files (.gwf)
  - lalsuite                 # LAL waveform infrastructure
  - gwpy                     # GW data access & processing

  # ── Jupyter kernel registration ───────────────────────────────────
  - ipykernel

  # ── Scientific stack (conda for binary compatibility) ─────────────
  - numpy
  - scipy
  - matplotlib
  - h5py
  - astropy
  - numba
  - pandas
  - scikit-learn
  - tqdm

  # ── pip-only packages ─────────────────────────────────────────────
  - pip:
    # JAX stack
    - jax
    - jaxlib
    - jaxopt
    - optax
    - equinox
    - flax

    # Waveform & PE
    - ripplegw
    - corner
    - anesthetic
    - seaborn
    - NetKet==3.20.5

    # Git-installed packages
    - "blackjax @ git+https://github.com/gabrieledemasi/blackjax@main"
    - "JenpyROQ @ git+https://github.com/GCArullo/JenpyROQ.git"

    # Utilities
    - PyYAML
    - toml
    - dacite
    - joblib
    - sortedcontainers
    - requests
