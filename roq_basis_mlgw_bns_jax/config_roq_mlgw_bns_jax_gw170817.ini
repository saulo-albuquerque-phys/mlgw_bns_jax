[I/O]
output              = ./roq_basis_mlgw_bns_jax/
verbose             = 1
debug               = 0
timing              = 1
show-plots          = 0
post-processing-only = 0
random-seed         = 170817

[Parallel]
parallel            = 0
n-processes         = 1

[Waveform_and_parametrisation]
approximant         = mlgw-bns-jax
spins               = aligned
tides               = 1
eccentricity        = 0
post-merger         = 0
dynamics            = 0
mc-q-par            = 1
m-q-par             = 0
spin-sph            = 0
f-min               = 23.0
f-max               = 2000.0
seglen              = 128.0

[ROQ]
gram-schmidt              = 0
basis-lin                 = 1
basis-qua                 = 1
pre-basis                 = corners
tolerance-pre-basis-lin   = 1e-4
tolerance-pre-basis-qua   = 1e-6
n-pre-basis-lin           = 100
n-pre-basis-qua           = 5
n-pre-basis-search-iter   = 100
n-training-set-cycles     = 3
training-set-sizes        = 10000,50000,100000
training-set-n-outliers   = 10,5,0
training-set-rel-tol      = 0.1,0.5,1.0
tolerance-lin             = 1e-4
tolerance-qua             = 1e-6
n-tests-post              = 1000
minimum-speedup           = 1.0

# Training range: restricted Mc for GW170817, full range for other params
[Training_range]
mc-min      = 1.18
mc-max      = 1.21
q-min       = 1.0
q-max       = 2.0
s1z-min     = -0.5
s1z-max     = 0.5
s2z-min     = -0.5
s2z-max     = 0.5
lambda1-min = 5.0
lambda1-max = 5000.0
lambda2-min = 5.0
lambda2-max = 5000.0
iota-min    = 0.0
iota-max    = 3.14159265358979
phiref-min  = 0.0
phiref-max  = 6.28318530717959

[Test_values]
mc      = 1.1977
q       = 1.0
s1z     = 0.0
s2z     = 0.0
lambda1 = 300.0
lambda2 = 300.0
iota    = 2.5
phiref  = 0.6
