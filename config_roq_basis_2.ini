# ROQ_basis_2 configuration
# ──────────────────────────────────────────────────────────────────────
# Parameters reproducing the basis described in the paper:
#
#   "A pre-selected basis is constructed using Npre = 200 (10) elements
#    for the linear (quadratic) case, and Nstep = 1000 points at each
#    step.  We set three enrichment cycles each composed of
#    [1e4, 1e5, 1e5] datapoints, Ni_out = 0 and a respective relative
#    tolerance of [0.1, 1.0, 1.0].  The resulting bases are composed of
#    267 (10) linear (quadratic) elements."
# ──────────────────────────────────────────────────────────────────────

[I/O]
output              = ./ROQ_basis_2/
verbose             = 1
debug               = 0
timing              = 1
show-plots          = 0
post-processing-only = 0
random-seed         = 170817

[Parallel]
parallel            = 0
n-processes         = 1

[Waveform_and_parametrisation]
approximant         = mlgw-bns-jax
spins               = aligned
tides               = 1
eccentricity        = 0
post-merger         = 0
dynamics            = 0
mc-q-par            = 1
m-q-par             = 0
spin-sph            = 0
f-min               = 23.0
f-max               = 2000.0
seglen              = 128.0

[ROQ]
gram-schmidt              = 0
basis-lin                 = 1
basis-qua                 = 1
pre-basis                 = corners

# Pre-selection: Npre = 200 (linear), 10 (quadratic)
n-pre-basis-lin           = 200
n-pre-basis-qua           = 10

# Nstep = 1000 candidate points tested at each pre-selection step
n-pre-basis-search-iter   = 1000

# Three enrichment cycles: [1e4, 1e5, 1e5] training waveforms
n-training-set-cycles     = 3
training-set-sizes        = 10000,100000,100000

# Ni_out = 0: no waveforms removed between cycles (basis only grows)
training-set-n-outliers   = 0,0,0

# Relative tolerance per cycle: effective_tol = abs_tol * rel_tol
# Cycle 1 (1e4): aggressive (0.1 × abs_tol) to quickly seed the basis
# Cycles 2–3 (1e5): standard (1.0 × abs_tol) for thorough refinement
training-set-rel-tol      = 0.1,1.0,1.0

tolerance-lin             = 1e-4
tolerance-qua             = 1e-6
n-tests-post              = 1000
minimum-speedup           = 1.0

# Training range: restricted Mc for GW170817, full range for other params
[Training_range]
mc-min      = 1.18
mc-max      = 1.21
q-min       = 1.0
q-max       = 2.0
s1z-min     = -0.5
s1z-max     = 0.5
s2z-min     = -0.5
s2z-max     = 0.5
lambda1-min = 5.0
lambda1-max = 5000.0
lambda2-min = 5.0
lambda2-max = 5000.0
iota-min    = 0.0
iota-max    = 3.14159265358979
phiref-min  = 0.0
phiref-max  = 6.28318530717959

[Test_values]
mc      = 1.1977
q       = 1.0
s1z     = 0.0
s2z     = 0.0
lambda1 = 300.0
lambda2 = 300.0
iota    = 2.5
phiref  = 0.6
